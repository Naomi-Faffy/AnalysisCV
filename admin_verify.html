<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Master Skills | CV Analyzer</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="shortcut icon" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260526_5">
    <style>
        body.admin-page {
            background:
                radial-gradient(circle at 14% 14%, rgba(54, 89, 160, 0.24), transparent 28%),
                radial-gradient(circle at 82% 10%, rgba(46, 204, 113, 0.12), transparent 24%),
                radial-gradient(circle at 80% 88%, rgba(41, 66, 128, 0.24), transparent 32%),
                linear-gradient(160deg, #07101f 0%, #0c1628 46%, #111c31 100%);
            color: #e7edf8;
        }

        body.admin-page .admin-header,
        body.admin-page .card,
        body.admin-page .stat-card,
        body.admin-page .skill-tag,
        body.admin-page .admin-input-row input,
        body.admin-page #message.message {
            color: inherit;
        }
    </style>
</head>
<body class="admin-page">
    <div class="admin-shell" style="width:100%;max-width:1180px;margin:0 auto;color:#e7edf8;">
        <div class="top-bar admin-header">
            <div class="admin-header-left">
                <h2 class="admin-title">Admin: Master Skills</h2>
            </div>
            <a class="admin-back-link" href="/">Back to App</a>
        </div>

        <div class="card admin-card" style="background:linear-gradient(180deg, rgba(14, 24, 42, 0.92), rgba(10, 17, 31, 0.82)), rgba(9, 14, 25, 0.72);border:1px solid rgba(255,255,255,0.08);color:#f7f9fc;">
            <div class="admin-section-title">
                <h3>Master Skills List</h3>
            </div>

            <div id="message" class="message" style="background:rgba(10,17,31,0.54);border:1px solid rgba(255,255,255,0.08);color:#f3f7ff;"></div>

            <div class="admin-stats">
                <div class="stat-card" style="background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04)), rgba(10,17,31,0.72);border:1px solid rgba(255,255,255,0.1);color:#f2f6ff;">
                    <div class="stat-value" id="skillCount">0</div>
                    <div class="stat-label">Total Skills</div>
                </div>
                <div class="stat-card accent" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;">
                    <input id="skillSearchInput" placeholder="Search skill..." style="flex:1;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#f2f6ff;">
                    <button class="btn-primary" onclick="searchSkill()" style="padding:8px 10px;border-radius:10px;">Search</button>
                </div>
            </div>

            <div class="admin-input-row">
                <input type="text" id="newSkillInput" placeholder="Enter a new skill" style="flex:1;padding:0.8rem 0.9rem;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(10,17,31,0.7);color:#f3f7ff;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);font:inherit;">
                <button class="btn-primary" onclick="addSkill()" style="background:linear-gradient(130deg, rgba(46,204,113,0.88), rgba(39,174,96,0.84));color:#f8fbff;border:1px solid rgba(46,204,113,0.35);">Add Skill</button>
            </div>

            <div class="skills-grid" id="skillsGrid"></div>

            <div class="actions admin-actions">
                <button class="btn-primary" onclick="saveChanges()" style="background:linear-gradient(130deg, rgba(46,204,113,0.88), rgba(39,174,96,0.84));color:#f8fbff;border:1px solid rgba(46,204,113,0.35);">Save Changes to File</button>
                <button class="btn-danger" onclick="resetToDefault()" style="background:linear-gradient(180deg, rgba(185,74,74,0.28), rgba(185,74,74,0.2));color:#ffd6d6;border:1px solid rgba(185,74,74,0.34);">Reset to Default</button>
            </div>
        </div>
    </div>

    <script>
        let originalSkills = [];
        let currentSkills = [];

        async function loadSkills() {
            try {
                const res = await fetch('/api/admin/master-skills');
                const data = await res.json();
                if (data.success) {
                    originalSkills = [...data.skills];
                    currentSkills = [...data.skills];
                    renderSkills();
                    updateStats();
                }
            } catch (error) {
                showMessage('Failed to load skills: ' + error.message, 'error');
            }
        }

        function renderSkills(filter) {
            const q = filter ? String(filter).trim().toLowerCase() : '';
            const grid = document.getElementById('skillsGrid');
            grid.innerHTML = currentSkills
                .sort()
                .map(skill => {
                    const isMatch = q && skill.toLowerCase().includes(q);
                    return `
                    <div class="skill-tag ${isMatch ? 'highlight' : ''}">
                        <span>${escapeHtml(skill)}</span>
                        <button class="btn btn-remove" onclick="removeSkill('${escapeHtml(skill)}')">×</button>
                    </div>
                `
                })
                .join('');
        }

        function addSkill() {
            const input = document.getElementById('newSkillInput');
            const skill = input.value.trim();
            if (!skill) {
                showMessage('Skill name cannot be empty', 'error');
                return;
            }
            if (currentSkills.includes(skill)) {
                showMessage(`"${skill}" already exists`, 'error');
                return;
            }
            currentSkills.push(skill);
            input.value = '';
            renderSkills();
            updateStats();
        }

        function removeSkill(skill) {
            currentSkills = currentSkills.filter(s => s !== skill);
            renderSkills();
            updateStats();
        }

        function searchSkill() {
            const q = document.getElementById('skillSearchInput').value || '';
            renderSkills(q);
            if (!q) return;
            // focus first match if present
            const first = document.querySelector('.skill-tag.highlight');
            if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // clearSkillSearch removed — Clear button no longer present

        function updateStats() {
            const skillCountEl = document.getElementById('skillCount');
            if (skillCountEl) {
                skillCountEl.textContent = currentSkills.length;
            }
            const changes = currentSkills.length !== originalSkills.length || 
                            !currentSkills.every(s => originalSkills.includes(s));
            const modifyCountEl = document.getElementById('modifyCount');
            if (modifyCountEl) {
                modifyCountEl.textContent = changes ? '✓' : '0';
            }
        }

        async function saveChanges() {
            try {
                const res = await fetch('/api/admin/master-skills', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ skills: currentSkills })
                });
                const data = await res.json();
                if (data.success) {
                    originalSkills = [...currentSkills];
                    updateStats();
                    showMessage('Skills saved successfully!', 'success');
                } else {
                    showMessage('Failed to save: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showMessage('Error saving skills: ' + error.message, 'error');
            }
        }

        async function resetToDefault() {
            if (!confirm('Reset to default skill list? This will discard all changes.')) return;
            try {
                const res = await fetch('/api/admin/master-skills/reset', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    await loadSkills();
                    showMessage('Reset to default skills', 'success');
                }
            } catch (error) {
                showMessage('Error resetting: ' + error.message, 'error');
            }
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
            setTimeout(() => el.className = 'message', 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('newSkillInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') addSkill();
        });

        loadSkills();
    </script>
</body>
</html>
